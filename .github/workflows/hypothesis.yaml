name: Slow Hypothesis CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types: [opened, reopened, synchronize, labeled]
  schedule:
  - cron: 0 0 * * *     # Daily “At 00:00” UTC
  workflow_dispatch: # allows you to trigger manually

env:
  FORCE_COLOR: 3

permissions: {}

jobs:
  detect-ci-trigger:
    name: detect ci trigger
    runs-on: ubuntu-latest
    if: |-
      ${{ (github.repository == 'pydata/xarray'
      && github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip-ci')) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false

    - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715   # v1.2.1
      id: detect-trigger
      with:
        keyword: '[skip-ci]'

    needs:
    - alpha_bridge_inputs
  cache-pixi-lock:
    needs:
    - detect-ci-trigger
    - alpha_bridge_inputs
    if: |-
      ${{ (always()
      && (
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        || (
          github.event_name == 'pull_request'
          && needs.detect-ci-trigger.outputs.triggered == 'false'
          && contains(github.event.pull_request.labels.*.name, 'run-slow-hypothesis')
        )
      )) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}

    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false

    - uses: 
        xarray-contrib/pixi-lock/create-and-cache@1fab4c17af8243f6ca1321bc941cf2325f46c05d       # v0.1.1
      id: pixi-lock

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: pixi-lock
        path: pixi.lock

  hypothesis:
    name: Slow Hypothesis Tests
    runs-on: ubuntu-latest

    needs:
    - cache-pixi-lock
    - alpha_bridge_inputs
    if: |-
      ${{ (always() && needs.cache-pixi-lock.result == 'success') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}

    defaults:
      run:
        shell: bash -l {0}

    env:
      PIXI_ENV: test-py313

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: 0   # Fetch all history for all branches and tags.
        persist-credentials: false

    - name: Restore cached pixi lockfile
      uses: 
        xarray-contrib/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d       # v0.1.1
      with:
        cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}

    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e   # v0.10.2
      with:
        pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
        cache: true
        environments: ${{ env.PIXI_ENV }}
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 
          'main' }}

    - name: set environment variables
      run: |
        echo "TODAY=$(date  +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "PYTHON_VERSION=$(pixi run -e ${{env.PIXI_ENV}} python --version | cut -d' ' -f2 | cut -d. -f1,2)" >> $GITHUB_ENV

    - name: Version info
      run: |
        pixi run -e ${{ env.PIXI_ENV }} python xarray/util/print_versions.py

      # https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
    - name: Restore cached hypothesis directory
      id: restore-hypothesis-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: .hypothesis/
        key: cache-hypothesis-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          cache-hypothesis-

    - name: Run slow Hypothesis tests
      if: success()
      id: status
      run: |
        pixi run -e ${{ env.PIXI_ENV }} python -m pytest --hypothesis-show-statistics --run-slow-hypothesis properties/*.py \
          --report-log output-${{ env.PIXI_ENV }}-log.jsonl

      # explicitly save the cache so it gets updated, also do this even if it fails.
    - name: Save cached hypothesis directory
      id: save-hypothesis-cache
      if: always() && steps.status.outcome != 'skipped'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: .hypothesis/
        key: cache-hypothesis-${{ runner.os }}-${{ github.run_id }}

    - name: Generate and publish the report
      if: |
        failure()
        && steps.status.outcome == 'failure'
        && github.event_name == 'schedule'
        && github.repository_owner == 'pydata'
      uses: 
        scientific-python/issue-from-pytest-log-action@35b4e0a9e06f8e7e261778289cf4b968b722662d       # v1.6.2
      with:
        log-path: output-${{ env.PIXI_ENV }}-log.jsonl
        issue-title: Nightly Hypothesis tests failed
        issue-label: topic-hypothesis
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: 14dd6a029bb0e77ea33bef3b304268a1eaaf6acb
        AB_WORKFLOW_DIGEST: 
          16c0ca819f42863f61d504fcd3059c9c4802340b2ea984da8efffb91b6b3eb87
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n  \
        \      \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
